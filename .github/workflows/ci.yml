name: CI
"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scipy statsmodels scikit-learn pytest
      - run: python -c "from data.synthetic_subscriptions import generate_subscription_data; df=generate_subscription_data(10,4); assert len(df)>0; print('OK')"
      - run: python -c "from optimizer.price_optimizer import RevenueOptimizer; o=RevenueOptimizer({'A':-1.5},{'A':50},{'A':100}); r=o.optimize(); print('optimizer OK')"
