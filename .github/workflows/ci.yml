name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scipy statsmodels scikit-learn pytest
      - run: python -c "from data.synthetic_subscriptions import generate_subscription_data; df=generate_subscription_data(20,6); assert len(df)>0; print('pricing data OK')"
      - run: python -c "from optimizer.price_optimizer import RevenueOptimizer, PricingConstraints; o=RevenueOptimizer({'Basic':-1.8,'Standard':-1.3},{'Basic':29,'Standard':49},{'Basic':500,'Standard':300}); res=o.optimize(); assert len(res)==2; print('optimizer OK')"
